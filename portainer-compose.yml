name: brother-cups

services:
  brother-cups:
    image: ghcr.io/vdite/brother-cups:latest
    pull_policy: always
    container_name: brother-cups
    restart: unless-stopped
    # Host network is required for Bonjour/AirPrint.
    network_mode: host
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      # Optionally set as a stack variable in Portainer. Empty = no login.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BROTHER_CUPS_UI_PORT: ${BROTHER_CUPS_UI_PORT:-8631}
      # Optional: automatic setup instead of using the setup page.
      PRINTER_URI: ${PRINTER_URI:-}
      PRINTER_MODEL: ${PRINTER_MODEL:-}
      PRINTER_NAME: ${PRINTER_NAME:-Brother}
      PAPER_SIZE: ${PAPER_SIZE:-A4}
    volumes:
      - brother-cups-config:/etc/cups
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    ulimits:
      nofile:
        soft: 4096
        hard: 4096

volumes:
  brother-cups-config:
    name: brother-cups-config
