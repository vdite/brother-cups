# For regular Linux servers with Docker. Builds the image locally from this repo.
services:
  brother-cups:
    build: .
    image: brother-cups:local
    container_name: brother-cups
    restart: unless-stopped
    network_mode: host
    environment:
      ADMIN_USER: admin
      ADMIN_PASSWORD: ""        # empty = setup page without login
      BROTHER_CUPS_UI_PORT: "8631"
      # Optional: create the printer automatically instead of using the setup page
      PRINTER_URI: ""           # e.g. socket://192.168.1.50:9100
      PRINTER_MODEL: ""         # e.g. MFC-7460DN
      PRINTER_NAME: Brother
      PAPER_SIZE: A4
    volumes:
      - ./config:/etc/cups
      - /var/run/dbus:/var/run/dbus
      # Lets CUPS resolve .local names announced by the printer
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
