<!doctype html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{t .Lang "login.page_title"}}</title>
  <link rel="stylesheet" href="/static/web/app.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark brand-mark-large" aria-hidden="true">
        <svg viewBox="0 0 32 32" role="img">
          <path d="M9 4h14v7H9zM7 12h18a4 4 0 0 1 4 4v7h-5v5H8v-5H3v-7a4 4 0 0 1 4-4Zm4-5v4h10V7Zm0 13v5h10v-5Z"/>
          <circle cx="24" cy="16" r="1.4"/>
        </svg>
      </div>
      <p class="eyebrow">Brother CUPS</p>
      <h1 id="login-title">{{t .Lang "login.title"}}</h1>
      <p class="login-intro">{{t .Lang "login.intro"}}</p>

      {{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}

      <form method="post" action="/login" class="stack-form">
        <label>
          <span>{{t .Lang "login.username"}}</span>
          <input name="username" value="{{.AdminUser}}" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>{{t .Lang "login.password"}}</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button button-primary button-full" type="submit">{{t .Lang "login.submit"}}</button>
      </form>

      <p class="helper-text">{{t .Lang "login.helper"}} <code>ADMIN_PASSWORD</code>.</p>
      <nav class="lang-switch" aria-label="{{t .Lang "footer.language"}}">
        <a href="/login?lang=en" lang="en" hreflang="en"{{if eq .Lang "en"}} aria-current="true"{{end}}>English</a>
        <a href="/login?lang=de" lang="de" hreflang="de"{{if eq .Lang "de"}} aria-current="true"{{end}}>Deutsch</a>
      </nav>
    </section>
  </main>
</body>
</html>
