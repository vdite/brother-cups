<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Anmelden · Brother CUPS</title>
  <link rel="stylesheet" href="/static/web/app.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark brand-mark-large" aria-hidden="true">
        <svg viewBox="0 0 32 32" role="img">
          <path d="M9 4h14v7H9zM7 12h18a4 4 0 0 1 4 4v7h-5v5H8v-5H3v-7a4 4 0 0 1 4-4Zm4-5v4h10V7Zm0 13v5h10v-5Z"/>
          <circle cx="24" cy="16" r="1.4"/>
        </svg>
      </div>
      <p class="eyebrow">Brother CUPS</p>
      <h1 id="login-title">Drucker einrichten</h1>
      <p class="login-intro">Melde Dich mit den Zugangsdaten an, die Du bei der Installation festgelegt hast.</p>

      {{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}

      <form method="post" action="/login" class="stack-form">
        <label>
          <span>Benutzername</span>
          <input name="username" value="{{.AdminUser}}" autocomplete="username" required autofocus>
        </label>
        <label>
          <span>Passwort</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button button-primary button-full" type="submit">Anmelden</button>
      </form>

      <p class="helper-text">Das Passwort entspricht der Umgebungsvariable <code>ADMIN_PASSWORD</code>.</p>
    </section>
  </main>
</body>
</html>
